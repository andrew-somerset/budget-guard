[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "budget-guard"
version = "0.1.0"
description = "Training-free, distribution-free budget guards for long-horizon LLM agents via online conformal prediction."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
classifiers = [
    "License :: OSI Approved :: MIT License",
]
# Lean runtime for the drop-in BudgetGuard wrapper (no GPU, no API). The full
# experiment suite needs the [experiments] extra. Lower bounds reflect the
# versions this was actually validated against (see requirements.txt for the
# exact pinned experiment environment); kept flexible here since this section
# governs the installable wrapper, not the frozen research harness.
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "lightgbm>=4.0",
    "scikit-learn>=1.3",  # required by lightgbm's sklearn API (LGBMRegressor/Classifier)
]

[project.optional-dependencies]
experiments = [
    "scipy>=1.10",
    "matplotlib>=3.7",
    "huggingface_hub>=0.20",
    "pytest>=7.0",
]

[tool.setuptools]
packages = ["budget_guard"]
